# You can modify this file to change most of the configurations I sell.
# Refer to the placeholders/example.yml file for more examples.
# For the MiniMessage format, check the documentation here: https://docs.advntr.dev/minimessage/format.html.
# For the plugin documentation, visit: https://docs.itsme.to/itsmyconfig.
# For support, join our Discord: discord.gg/itsme-to.
# 
# To find all configurations compatible with ItsMyConfig, which adapt directly to the style you have defined,
# visit: https://builtbybit.com/resources/bundle/itsmyconfig-config.1081/

custom-placeholder:
  # colored_text only supports MiniMessage and custom tags like SmallCaps or Placeholder (p)
  server-name:
    value: "<gradient:#ff0f7b:#f89b29><bold>ServerName</bold></gradient>"
    type: colored_text
  
  # Use MiniMessage here too 
  prefix:
    value: "<p:server-name> <p:text-color>┃"
  error-prefix:
    value: "<red><bold>ERROR</bold></red> <p:text-color>┃"
    
  # Can be #RRGGBB or color names: black, dark_blue, dark_green, dark_aqua, dark_red, dark_purple, gold, gray, dark_gray, blue, green, aqua, red, light_purple, yellow, or white.
  primary-color:
    value: "yellow"
    type: color
    bold: false
  secondary-color:
    value: "gold"
    type: color
  text-color:
    value: "white"
    type: color
  dark-color:
    value: "gray"
    type: color
  darkest-color:
    value: "dark_gray"
    type: color
    
  # Just put the link without https://
  discord:
    value: "discord.gg/example"
  store:
    value: "store.servername.net"
  ip:
    value: "play.servername.net"
  
  # Use MiniMessage here too, {0} refers to the amount
  exp-format:
    value: "<#F15BB5>{0}◎</#F15BB5>"
    type: colored_text
  eco-format:
    value: "<yellow>{0}⛁</yellow>"
    type: colored_text
  
  # Modify the economy of the configuration that I sell. You can make it higher or lower. {0} refers to the amount. Making it 10*{0} will make the reward, for example, 10 times bigger.
  price-modifier:
    value: "1*{0}"
    type: math
    rounding: HALF_UP
    precision: 1

  # ── Requirement examples ──

  # AND mode (default): all requirements must pass.
  # Usage: %itsmyconfig_req-and-example%
  req-and-example:
    type: string
    value: "&aYou meet all conditions"
    requirements:
      has-money:
        type: ">="
        input: "%vault_eco_balance%"
        output: "100"
        deny: "&cYou need at least 100 coins"
      has-level:
        type: ">="
        input: "%player_level%"
        output: "10"
        deny: "&cYou need at least level 10"

  # OR mode: at least one requirement must pass.
  # Usage: %itsmyconfig_req-or-example%
  req-or-example:
    type: string
    value: "&aAccess granted"
    requirements:
      mode: or
      is-vip:
        type: string equals
        input: "%luckperms_has_permission_vip.access%"
        output: "true"
        deny: "&cYou are not VIP"
      is-admin:
        type: string equals
        input: "%luckperms_has_permission_admin.access%"
        output: "true"
        deny: "&cYou are not Admin"

  # XOR mode: exactly one requirement must pass.
  # Usage: %itsmyconfig_req-xor-example%
  req-xor-example:
    type: string
    value: "&aExactly one condition met"
    requirements:
      mode: xor
      is-op:
        type: string equals
        input: "%player_is_op%"
        output: "true"
        deny: "&cCondition not met"
      is-vip:
        type: string equals
        input: "%luckperms_has_permission_vip.access%"
        output: "true"
        deny: "&cCondition not met"

  # Negate: inverts the result of a requirement.
  # Here "not banned" means the player must NOT match output "true".
  # Usage: %itsmyconfig_req-negate-example%
  req-negate-example:
    type: string
    value: "&aYou are not banned"
    requirements:
      not-banned:
        type: string equals
        input: "%player_is_banned%"
        output: "true"
        negate: true
        deny: "&cYou are banned"

  # Combined: OR mode with negate.
  # Pass if VIP or not banned.
  # Usage: %itsmyconfig_req-combined-example%
  req-combined-example:
    type: string
    value: "&aWelcome!"
    requirements:
      mode: or
      is-vip:
        type: string equals
        input: "%luckperms_has_permission_vip.access%"
        output: "true"
        deny: "&cAccess denied"
      not-banned:
        type: string equals
        input: "%player_is_banned%"
        output: "true"
        negate: true
        deny: "&cYou are banned"
